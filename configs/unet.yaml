# Supervised U-Net (Regime C: pixel labels), grouped cross-validation on test_public.
# See src/defect_detection/training/supervised.py for the protocol.
experiment_name: unet_sheet_metal_cv
data_config: dataset.yaml   # relative to this file

data:
  # Geometric flips only, so the comparison with the (unaugmented) normal-only
  # models is not confounded by photometric augmentation.
  augmentation:
    hflip_p: 0.5
    vflip_p: 0.5

model:
  name: unet
  backbone: resnet18
  pretrained: true
  decoder_channels: 64

cross_validation:
  n_folds: 5
  split: test               # logical split holding pixel labels (test_public)

training:
  epochs: 30                # fixed a priori; final weights are used
  batch_size: 4
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  loss: bce_dice
  grad_accum_steps: 1
  num_workers: 0
  device: auto
  select_best: false        # validation has no defects, so it cannot guide selection

scoring:
  smoothing_sigma: 0.0      # thresholds apply directly to the sigmoid map
  image_score: max

threshold:                  # predefined, not tuned on any data
  image: 0.5
  pixel: 0.5
